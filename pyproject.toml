[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-muck"
version = "0.4.2"
authors = [
  { name="Daniel Tiesling", email="tiesling@gmail.com" },
]
description = "Batteries included framework for generating RESTful apis using FastAPI and SqlAlchemy."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI"
]
dependencies = [
    "fastapi >= 0.115.14",
    "sqlalchemy >= 1.4.0",
    "marshmallow >= 3.15.0",
    "pydantic >= 2.0",
    "apispec >= 6.3.0",
    "jinja2 >= 3.0.0",
    "rich >= 13.7.0",
    "pyhumps >= 3.8.0",
    "typer >= 0.9.0",
    "marshmallow-jsonschema-python3 >= 0.13.1"
]

[project.urls]
"Homepage" = "https://github.com/dtiesling/flask-muck"
"Repository" = "https://github.com/dtiesling/flask-muck"
"Documentation" = "https://dtiesling.github.io/flask-muck/"

[tool]
[tool.hatch.version]
path = "src/fastapi_muck/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/examples",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_muck"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.poetry]
name = "fastapi-muck"
description = "Batteries included framework for generating RESTful apis using FastAPI and SqlAlchemy."
version = "0.0.1"
authors = ["Daniel Tiesling <tiesling@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.115.14"
sqlalchemy = "^2.0.23"
marshmallow = "^3.20.1"
mkdocstrings = {extras = ["python"], version = "^0.24.0"}
pydantic = "^2.5.2"
apispec = "^6.3.0"
jinja2 = "^3.1.2"
rich = "^13.7.0"
pyhumps = "^3.8.0"
typer = "^0.9.0"
marshmallow-jsonschema = { git = "https://github.com/dtiesling/marshmallow-jsonschema.git" }

[tool.poetry.group.dev.dependencies]
mypy = "^1.6.1"
types-requests = "^2.31.0.10"
sqlalchemy-stubs = "^0.4"
pytest = ">=7.4.3,<9.0.0"
httpx = "^0.27.0"
itsdangerous = "^2.1.2"
uvicorn = "^0.29.0"
coverage = "^7.3.2"
pytest-cov = "^4.1.0"
syrupy = "^4.6.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.4.11"
mkdocstrings = {extras = ["python"], version = "^0.24.0"}
mike = "^2.0.0"
hatch = "^1.9.3"

[tool.mypy]
packages = "src"
strict = true
disallow_untyped_calls = false
warn_return_any = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test*.py"
pythonpath = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 94
exclude_also = [
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
    "raise NotImplementedError"
]
